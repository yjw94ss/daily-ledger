<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f7f7f8"><title>日常账本</title><style>
:root{font-family:"Helvetica Neue",Arial,"PingFang SC","Microsoft YaHei",sans-serif;color:#171717;background:#f7f7f8;font-synthesis:none}*{box-sizing:border-box}body{margin:0}.wrap{max-width:1200px;margin:auto;padding:0 30px}header{height:88px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #c9c9cc}.brand{font-size:22px;font-weight:800;letter-spacing:-1px}.brand span{color:#e4002b}button,input,select{font:inherit}button{cursor:pointer}.top-actions{display:flex;gap:8px}.btn{border:1px solid #c6c6c9;background:transparent;padding:11px 15px;font-weight:600}.btn:hover{border-color:#171717}.primary{background:#171717;color:white;border-color:#171717}.primary:hover{background:#e4002b;border-color:#e4002b}.hero{padding:56px 0 35px;display:flex;justify-content:space-between;align-items:end;gap:20px}.eyebrow{font-size:12px;font-weight:700;letter-spacing:.14em;color:#e4002b}.hero h1{font-size:clamp(38px,6vw,72px);line-height:1;margin:14px 0;letter-spacing:-.06em}.hero p,.muted{color:#707074}.month{display:flex;align-items:center;gap:8px;font-weight:700}.month input{border:1px solid #c6c6c9;padding:10px;background:white}.stats{display:grid;grid-template-columns:repeat(3,1fr);border-top:2px solid #171717;border-bottom:1px solid #c6c6c9}.stat{padding:22px 24px 28px 0}.stat+ .stat{padding-left:24px;border-left:1px solid #c6c6c9}.stat label{font-size:13px;color:#6f6f73}.stat strong{display:block;font-size:clamp(25px,3vw,38px);letter-spacing:-.04em;margin-top:14px;font-variant-numeric:tabular-nums}.red{color:#e4002b}.main{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:56px;padding:48px 0}.section-head{display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid #171717;padding-bottom:16px;gap:12px}.section-head h2{font-size:22px;margin:0;letter-spacing:-.04em}.section-head select{border:0;background:transparent;padding:8px}.empty{padding:65px 0;text-align:center;color:#777;line-height:1.7}.entry{display:grid;grid-template-columns:1fr auto;gap:12px;border-bottom:1px solid #d5d5d8;padding:19px 0}.entry-title{font-weight:700}.entry-meta{font-size:13px;color:#777;margin-top:7px}.entry-right{text-align:right}.amount{font-weight:700;font-size:18px;font-variant-numeric:tabular-nums}.entry-actions{margin-top:8px}.link{background:none;border:0;color:#777;padding:2px 0 2px 12px;font-size:12px}.link:hover{color:#e4002b}.form-title{display:flex;align-items:baseline;justify-content:space-between;border-bottom:2px solid #171717;padding-bottom:16px}.form-title h2{margin:0;font-size:22px}.form-title span{font-size:12px;color:#777}.type-toggle{display:grid;grid-template-columns:1fr 1fr;margin:22px 0}.type-toggle button{padding:12px;border:1px solid #c6c6c9;background:transparent;font-weight:700}.type-toggle button.active{background:#171717;color:white;border-color:#171717}.field{display:block;margin:18px 0}.field span{display:block;font-size:13px;font-weight:700;margin-bottom:8px}.field input,.field select{width:100%;padding:12px;border:1px solid #c6c6c9;background:#fff;border-radius:0;outline:none}.field input:focus,.field select:focus{border-color:#e4002b}.submit{width:100%;padding:14px}.cancel{width:100%;margin-top:8px}.note{font-size:12px;color:#777;line-height:1.7;margin-top:18px}.notice{color:#e4002b;font-size:13px;min-height:1em}footer{border-top:1px solid #c6c6c9;padding:23px 0 40px;color:#777;font-size:12px}.file{display:none}@media(max-width:760px){.wrap{padding:0 18px}header{height:72px}.top-actions .btn{padding:9px;font-size:12px}.hero{padding-top:40px;align-items:start;flex-direction:column}.stats{gap:0}.stat{padding-right:8px}.stat+.stat{padding-left:10px}.stat strong{font-size:21px}.main{grid-template-columns:1fr;gap:38px}.form-panel{grid-row:1}.hero h1{font-size:48px}}
dialog{border:1px solid #171717;padding:0;width:min(680px,calc(100% - 28px));max-height:85vh}dialog::backdrop{background:rgba(0,0,0,.55)}.dialog-inner{padding:26px}.dialog-inner h2{margin:0 0 12px}.preview-list{max-height:38vh;overflow:auto;border-top:1px solid #ccc;margin:18px 0}.preview-row{display:flex;justify-content:space-between;gap:12px;border-bottom:1px solid #ddd;padding:10px 0;font-size:13px}.dialog-actions{display:flex;justify-content:flex-end;gap:8px}.import-info{font-size:13px;color:#666;line-height:1.6}@media(max-width:760px){header{height:auto;min-height:72px;gap:12px;flex-wrap:wrap;padding:14px 0}.top-actions{flex-wrap:wrap}}
</style></head><body><div class="wrap"><header><div class="brand">日常账本<span>.</span></div><div class="top-actions"><button class="btn" id="wechatBtn">导入微信账单</button><input id="wechatFile" class="file" type="file" accept=".csv,text/csv"><button class="btn" id="importBtn">导入备份</button><button class="btn" id="exportBtn">导出备份</button><input id="file" class="file" type="file" accept="application/json,.json"></div></header><section class="hero"><div><div class="eyebrow">YOUR MONEY, YOUR NOTES</div><h1>把日子，<br>记清楚。</h1><p>记录每一笔收支，看看钱都去了哪里。</p></div><label class="month">查看月份 <input id="month" type="month" aria-label="查看月份"></label></section><section class="stats" aria-label="月度汇总"><div class="stat"><label>本月收入</label><strong id="income">¥0.00</strong></div><div class="stat"><label>本月支出</label><strong class="red" id="expense">¥0.00</strong></div><div class="stat"><label>本月结余</label><strong id="balance">¥0.00</strong></div></section><main class="main"><section><div class="section-head"><h2>收支明细</h2><select id="filter" aria-label="筛选收支类型"><option value="all">全部记录</option><option value="expense">支出</option><option value="income">收入</option></select></div><div id="list"></div></section><aside class="form-panel"><div class="form-title"><h2 id="formTitle">记一笔</h2><span>人民币 CNY</span></div><form id="form"><div class="type-toggle" role="group" aria-label="收支类型"><button type="button" data-type="expense" class="active">支出</button><button type="button" data-type="income">收入</button></div><label class="field"><span>金额</span><input id="amount" type="number" min="0.01" max="999999999" step="0.01" placeholder="0.00" required inputmode="decimal"></label><label class="field"><span>分类</span><select id="category"></select></label><label class="field"><span>日期</span><input id="date" type="date" required></label><label class="field"><span>备注 <span style="display:inline;font-weight:400;color:#888">（选填）</span></span><input id="memo" maxlength="100" placeholder="写点什么"></label><p id="error" class="notice" role="status"></p><button class="btn primary submit" type="submit" id="submit">保存记录</button><button class="btn cancel" type="button" id="cancel" hidden>取消编辑</button></form><p class="note">记录保存在当前浏览器中，不会自动同步。清除浏览器数据前，请先导出备份。</p></aside></main><footer>日常账本 · 数据由你掌握</footer></div><dialog id="wechatDialog"><div class="dialog-inner"><h2>导入微信账单</h2><p id="wechatSummary" class="import-info"></p><p class="import-info">分类默认为“其他”，导入后可编辑。账单仅在本机处理；重复识别依据微信交易单号。</p><div id="wechatPreview" class="preview-list"></div><div class="dialog-actions"><button class="btn" id="wechatCancel" type="button">取消</button><button class="btn primary" id="wechatConfirm" type="button">确认导入</button></div></div></dialog><script src="wechat.js"></script><script>
(()=>{'use strict';const KEY='daily-ledger-v1', $=s=>document.querySelector(s), categories={expense:['餐饮','交通','购物','居住','娱乐','医疗','教育','其他'],income:['工资','奖金','兼职','理财','其他']};let records=[],type='expense',editing=null;const today=()=>{let d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};const money=n=>'¥'+(n/100).toLocaleString('zh-CN',{minimumFractionDigits:2,maximumFractionDigits:2});function save(next){try{localStorage.setItem(KEY,JSON.stringify(next));records=next;return true}catch(e){$('#error').textContent='保存失败，请检查浏览器存储空间或隐私设置。';return false}}function valid(r){if(!r||typeof r.id!=='string'||!r.id||!['income','expense'].includes(r.type)||!Number.isSafeInteger(r.amount)||r.amount<=0||r.amount>99999999900||typeof r.category!=='string'||!r.category||r.category.length>100||typeof r.memo!=='string'||r.memo.length>100||typeof r.date!=='string'||!/^\d{4}-\d{2}-\d{2}$/.test(r.date))return false;const d=new Date(r.date+'T00:00:00');return !isNaN(d)&&`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`===r.date}function setType(t,selected){type=t;document.querySelectorAll('[data-type]').forEach(b=>b.classList.toggle('active',b.dataset.type===t));$('#category').replaceChildren(...categories[t].map(c=>{let o=document.createElement('option');o.textContent=c;return o}));if(selected&&!categories[t].includes(selected)){let o=document.createElement('option');o.textContent=selected;$('#category').append(o)}if(selected)$('#category').value=selected}function reset(){editing=null;$('#form').reset();$('#date').value=today();$('#formTitle').textContent='记一笔';$('#submit').textContent='保存记录';$('#cancel').hidden=true;$('#error').textContent='';setType('expense')}function render(){let rows=records.filter(r=>r.date.slice(0,7)===$('#month').value),inc=rows.filter(r=>r.type==='income').reduce((s,r)=>s+r.amount,0),exp=rows.filter(r=>r.type==='expense').reduce((s,r)=>s+r.amount,0);$('#income').textContent=money(inc);$('#expense').textContent=money(exp);$('#balance').textContent=(inc-exp<0?'-':'')+money(Math.abs(inc-exp));let filtered=rows.filter(r=>$('#filter').value==='all'||r.type===$('#filter').value).sort((a,b)=>b.date.localeCompare(a.date));let list=$('#list');list.replaceChildren();if(!filtered.length){let p=document.createElement('div');p.className='empty';p.textContent='这个月还没有符合条件的记录。';list.append(p);return}for(const r of filtered){let row=document.createElement('div');row.className='entry';let left=document.createElement('div'),title=document.createElement('div'),meta=document.createElement('div'),right=document.createElement('div'),amt=document.createElement('div'),actions=document.createElement('div');title.className='entry-title';title.textContent=r.category;meta.className='entry-meta';meta.textContent=r.date+(r.memo?' · '+r.memo:'');right.className='entry-right';amt.className='amount'+(r.type==='expense'?' red':'');amt.textContent=(r.type==='expense'?'−':'+')+money(r.amount);actions.className='entry-actions';for(const [label,fn] of [['编辑',()=>edit(r.id)],['删除',()=>remove(r.id)]]){let b=document.createElement('button');b.className='link';b.textContent=label;b.onclick=fn;actions.append(b)}left.append(title,meta);right.append(amt,actions);row.append(left,right);list.append(row)}}function edit(id){let r=records.find(x=>x.id===id);if(!r)return;editing=id;setType(r.type,r.category);$('#amount').value=(r.amount/100).toFixed(2);$('#date').value=r.date;$('#memo').value=r.memo;$('#formTitle').textContent='编辑记录';$('#submit').textContent='保存修改';$('#cancel').hidden=false;$('#amount').focus()}function remove(id){if(confirm('确定删除这条记录？')){if(save(records.filter(r=>r.id!==id))){if(editing===id)reset();render()}}}document.querySelectorAll('[data-type]').forEach(b=>b.onclick=()=>setType(b.dataset.type));$('#form').onsubmit=e=>{e.preventDefault();let n=Number($('#amount').value),r={id:editing||('r'+Date.now().toString(36)+Math.random().toString(36).slice(2)),type,amount:Math.round(n*100),category:$('#category').value,date:$('#date').value,memo:$('#memo').value.trim()};if(!valid(r)){ $('#error').textContent='请填写有效的金额和日期。';return}let next=editing?records.map(x=>x.id===editing?r:x):[r,...records];if(save(next)){$('#month').value=r.date.slice(0,7);reset();render()}};$('#cancel').onclick=reset;$('#month').onchange=render;$('#filter').onchange=render;$('#exportBtn').onclick=()=>{let blob=new Blob([JSON.stringify({version:1,records},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='日常账本备份-'+today()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};$('#importBtn').onclick=()=>$('#file').click();$('#file').onchange=async e=>{let f=e.target.files[0];if(!f)return;try{if(f.size>5*1024*1024)throw Error();let data=JSON.parse(await f.text());if(data.version!==1||!Array.isArray(data.records)||!data.records.every(valid)||new Set(data.records.map(x=>x.id)).size!==data.records.length)throw Error();if(confirm(`备份包含 ${data.records.length} 条记录。导入将替换当前全部记录，是否继续？`)){if(save(data.records)){reset();render();alert('备份已导入。')}}}catch{alert('备份文件无效，请选择本账本导出的 JSON 文件。')}finally{e.target.value=''}};let pendingWechat=[];$('#wechatBtn').onclick=()=>$('#wechatFile').click();$('#wechatFile').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{if(f.size>10*1024*1024)throw Error('文件超过 10 MB，请分批导出。');const bytes=await f.arrayBuffer();let text;try{text=new TextDecoder('utf-8',{fatal:true}).decode(bytes)}catch{text=new TextDecoder('gb18030').decode(bytes)}let result=WechatImport.parseWechat(text,records);pendingWechat=result.records;$('#wechatSummary').textContent=`可导入 ${result.records.length} 条；重复 ${result.duplicates} 条；跳过 ${result.skipped} 条（包括不计收支、退款、未完成或无法识别的记录）。请与原账单核对。`;let preview=$('#wechatPreview');preview.replaceChildren();for(const r of pendingWechat){let row=document.createElement('div');row.className='preview-row';let label=document.createElement('span'),value=document.createElement('strong');label.textContent=r.date+' · '+(r.memo||'微信交易');value.textContent=(r.type==='expense'?'−':'+')+money(r.amount);row.append(label,value);preview.append(row)}$('#wechatConfirm').disabled=!pendingWechat.length;$('#wechatDialog').showModal()}catch(err){alert(err.message||'无法读取文件，请选择微信导出的 CSV 账单。')}finally{e.target.value=''}};$('#wechatCancel').onclick=()=>{$('#wechatDialog').close();pendingWechat=[]};$('#wechatConfirm').onclick=()=>{let ids=new Set(records.map(x=>x.id)),fresh=pendingWechat.filter(x=>!ids.has(x.id));if(!fresh.length){$('#wechatDialog').close();alert('没有新的记录可导入。');return}if(save([...fresh,...records])){let first=fresh[0];reset();$('#month').value=first.date.slice(0,7);render();$('#wechatDialog').close();pendingWechat=[];alert(`已导入 ${fresh.length} 条微信账单。`)}};try{let raw=localStorage.getItem(KEY);if(raw){let parsed=JSON.parse(raw);if(!Array.isArray(parsed)||!parsed.every(valid))throw Error();records=parsed}}catch{ $('#error').textContent='无法读取本地数据，请检查浏览器存储设置。'}$('#month').value=today().slice(0,7);let error=$('#error').textContent;reset();if(error)$('#error').textContent=error;render()})();
</script></body></html>
